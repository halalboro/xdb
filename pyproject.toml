[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xdb"
version = "0.1.0"
description = "Generic FPGA ILA debug toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "taugoust" }]
dependencies = [
  "chipscopy>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.0",
  "ruff>=0.6.0",
]

[project.scripts]
xdb = "xdb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]
